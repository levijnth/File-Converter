<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Converter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236d5dfc'/><path d='M9 12h11l-3-3M23 20H12l3 3' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/xlsx/xlsx.full.min.js"></script>
  <script src="vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="vendor/jszip/jszip.min.js"></script>
  <script src="vendor/mammoth/mammoth.browser.min.js"></script>
  <script src="vendor/marked/marked.umd.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 9h12l-3.5-3.5M19 15H7l3.5 3.5" /></svg>
      </div>
      <div>
        <h1>File Converter</h1>
        <p class="tagline"><span class="dot"></span><span id="tagline">100% local. Your files never leave this device.</span></p>
      </div>
    </div>
    <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main>
    <label id="dropzone" class="dropzone" tabindex="0">
      <input id="fileInput" type="file" multiple hidden>
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </div>
      <p class="drop-title" id="dropTitle">Drop files here or <span class="link">browse</span></p>
      <p class="drop-sub" id="dropSub">You can also paste images with Ctrl+V</p>
      <div class="format-chips" id="formatChips"></div>
    </label>

    <section id="workspace" class="workspace hidden">
      <div class="toolbar">
        <div class="toolbar-left">
          <h2 id="queueTitle">Files</h2>
          <div class="bulk" id="bulkBox">
            <span>Convert all to</span>
            <div class="bulk-targets" id="bulkTargets"></div>
          </div>
        </div>
        <div class="toolbar-right">
          <button id="settingsBtn" class="btn ghost" aria-expanded="false">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
            Options
          </button>
          <button id="mergeBtn" class="btn ghost hidden" title="Combine all images into a single PDF">
            <svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/></svg>
            Merge images → PDF
          </button>
          <button id="clearBtn" class="btn ghost">Clear</button>
          <button id="downloadAllBtn" class="btn secondary" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>
            Download all
          </button>
          <button id="convertAllBtn" class="btn primary">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            Convert all
          </button>
        </div>
      </div>

      <div id="settings" class="settings hidden">
        <label class="setting">
          <span>Image quality <b id="qualityVal">92%</b></span>
          <input id="quality" type="range" min="10" max="100" value="92">
          <small>Applies to JPG, WEBP and images inside PDFs</small>
        </label>
        <label class="setting">
          <span>PDF page resolution</span>
          <select id="pdfScale">
            <option value="1">72 DPI (small)</option>
            <option value="2" selected>144 DPI (standard)</option>
            <option value="3">216 DPI (high)</option>
            <option value="4.1667">300 DPI (print)</option>
          </select>
          <small>Used when turning PDF pages into images</small>
        </label>
        <label class="setting">
          <span>Background for transparency</span>
          <div class="color-row">
            <input id="background" type="color" value="#ffffff">
            <code id="backgroundVal">#ffffff</code>
          </div>
          <small>JPG, BMP and PDF don't support transparency</small>
        </label>
        <label class="setting switch-setting">
          <span>Auto-download results</span>
          <input id="autoDownload" type="checkbox" class="switch">
          <small>Save each file as soon as it's converted</small>
        </label>
      </div>

      <ul id="fileList" class="file-list"></ul>
    </section>
  </main>

  <div id="dragOverlay" class="drag-overlay" aria-hidden="true">
    <div class="drag-overlay-inner">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <p>Drop to add files</p>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
